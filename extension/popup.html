<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Fact Checker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 320px;
            margin: 0;
            padding: 16px;
            color: #202124;
            background: #fff;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1e1e1e; color: #e0e0e0; }
        }
        .header {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            margin-right: 8px;
        }
        .status-dot.online { background: #137333; }
        .status-dot.offline { background: #c5221f; }
        
        .instructions {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        @media (prefers-color-scheme: dark) {
            .instructions { background: #2d2d2d; }
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }
        .stat-main {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #1a73e8;
        }
        @media (prefers-color-scheme: dark) {
            .stat-value { color: #8ab4f8; }
        }
        .stat-label {
            font-size: 11px;
            color: #5f6368;
            text-transform: uppercase;
        }
        .stat-divider {
            background: #e0e0e0;
            height: 100%;
        }
        .stat-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }
        .stat-critic { color: #c5221f; font-weight: bold; }
        .stat-high { color: #b45309; font-weight: bold; }
        .stat-med { color: #92400e; font-weight: bold; }
        .stat-low { color: #137333; font-weight: bold; }

        .btn-group {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-refresh {
            background: #f1f3f4;
            color: #3c4043;
        }
        .btn-refresh:hover { background: #e8eaed; }
        .btn-clear {
            background: #fff;
            color: #d93025;
            border: 1px solid #fad2cf;
        }
        .btn-clear:hover { background: #fce8e6; }
        
        @media (prefers-color-scheme: dark) {
            .btn-refresh { background: #3c4043; color: #e8eaed; }
            .btn-refresh:hover { background: #5f6368; }
            .btn-clear { background: transparent; border-color: #5c1b16; }
            .btn-clear:hover { background: #5c1b16; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div id="status-dot" class="status-dot"></div>
        <h1>Health Fact Checker</h1>
    </div>

    <div class="instructions">
        Select any medical claim on a webpage and click the <strong>Check  Verify claim</strong> button to check its accuracy.
    </div>

    <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">Session Stats</div>
    <div class="stats-grid">
        <div class="stat-main">
            <div id="total-checks" class="stat-value">0</div>
            <div class="stat-label">Total Checks</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-items">
            <div class="stat-row"><span class="stat-critic">Critical</span> <span id="stat-critical">0</span></div>
            <div class="stat-row"><span class="stat-high">High</span> <span id="stat-high">0</span></div>
            <div class="stat-row"><span class="stat-med">Medium</span> <span id="stat-medium">0</span></div>
            <div class="stat-row"><span class="stat-low">Low</span> <span id="stat-low">0</span></div>
        </div>
    </div>

    <div class="btn-group">
        <button id="refresh-btn" class="btn-refresh">Refresh Status</button>
        <button id="clear-btn" class="btn-clear">Clear Stats</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
